name: Sync Protocol

on:
  # GAP-073: an SDK source change must exercise the cross-language round-trip,
  # not only a protocol dispatch. Before this, a wire-format-breaking change to
  # harness/protocol/testbed code shipped with every workflow green and zero
  # round-trip runs. Paths are scoped to the files that can change the SDK's
  # wire behaviour; board/.vfs/.gitreins bookkeeping and prose docs are
  # excluded, so a foreman bookkeeping commit cannot fire the workflow.
  push:
    branches: [main]
    paths:
      - "harness/**"
      - "protocol/**"
      - "testbed/**"
      - "cmd/**"
      - "examples/**"
      - "go.mod"
      - "Makefile"
      - ".github/workflows/sync-protocol.yml"
  pull_request:
    branches: [main]
    paths:
      - "harness/**"
      - "protocol/**"
      - "testbed/**"
      - "cmd/**"
      - "examples/**"
      - "go.mod"
      - "Makefile"
      - ".github/workflows/sync-protocol.yml"
  repository_dispatch:
    types: [protocol-update]
  workflow_dispatch:

env:
  GO_VERSION: "1.23"

jobs:
  sync:
    name: Sync & Release
    # GAP-073: this is the protocol SYNC & RELEASE path — its "Create tag" and
    # "Create GitHub Release" steps run unconditionally, and there is no
    # protocol_version on a push. Keep it pinned to the events it was written
    # for: on a push it would tag `v$(date)-sync`, and the second push of the
    # same day would fail on the existing tag. Because the round-trip job
    # `needs:` this one, that failure would suppress the very run this workflow
    # now exists to fire. The round-trip job itself runs for every event.
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sdk-go
        uses: actions/checkout@v4
        with:
          path: sdk-go
          fetch-depth: 0

      - name: Checkout protocol
        uses: actions/checkout@v4
        with:
          repository: get-h3/protocol
          path: protocol
          ref: ${{ github.event.client_payload.ref || 'main' }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Copy schemas into SDK
        run: |
          rm -rf sdk-go/protocol/schemas/v1
          cp -r protocol/schemas/v1 sdk-go/protocol/schemas/v1
          echo "Schemas synced from protocol repo (${{ github.event.client_payload.ref || 'main' }})"

      - name: Regenerate types from schemas
        working-directory: sdk-go
        run: |
          go generate ./protocol/...
          echo "Types regenerated"

      - name: Verify no dirty files
        working-directory: sdk-go
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changed files after regeneration:"
            git diff --stat
          else
            echo "No changes — types match current schemas"
          fi

      - name: Build
        working-directory: sdk-go
        run: go build ./...

      - name: Vet
        working-directory: sdk-go
        run: go vet ./...

      - name: Test
        working-directory: sdk-go
        run: go test ./... -count=1 -short -race

      - name: Determine tag
        id: tag
        working-directory: sdk-go
        run: |
          # SDKGO-CI-004 (finding, NOT fixed here): the 09-23 protocol dispatch carried
          # client_payload.protocol_version (sibling SDKs read that key — sdk-python's run
          # 35855671172 logged PROTOCOL_VERSION=v1.1.0), while this step reads
          # client_payload.version, which no producer sends. Do NOT "fix" that by tagging
          # the protocol version here: sdk-go is a Go MODULE, so a tag vX.Y.Z is a published
          # module version, and the SDK's own release line is v0.1.x — a protocol tag would
          # claim an API stability this module never released. The date tag is the sync
          # provenance tag; the dispatched protocol ref is recorded in the release notes
          # below. Deciding the sync-tag namespace belongs to SDKGO-CI-004.
          if [ -n "${{ github.event.client_payload.version }}" ]; then
            TAG="v${{ github.event.client_payload.version }}"
          else
            TAG="v$(date +'%Y.%m.%d')-sync"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Tag: ${TAG}"

      - name: Create tag
        working-directory: sdk-go
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.tag.outputs.tag }}"
          # Idempotent: a protocol release is dispatched twice (first batch without a payload,
          # second with protocol_version), so this step can run again for a tag it already
          # created. `git tag` exits 128 on an existing tag, which would fail the job and
          # starve the roundtrip job that `needs:` this one.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping (idempotent re-run)."
          else
            git tag -a "${TAG}" -m "Sync protocol schemas — ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            ## Protocol Sync

            - Schemas synced from `get-h3/protocol@${{ github.event.client_payload.ref || 'main' }}`
            - Types regenerated
            - All tests passing

            Auto-generated by Sync Protocol workflow.
          generate_release_notes: false

  roundtrip:
    # GAP-073: unchanged for repository_dispatch/workflow_dispatch — a failed
    # sync/release still blocks the round-trip — but a SKIPPED sync (the
    # push/pull_request path, where sync holds no work) must not block it.
    needs: sync
    if: ${{ !cancelled() && (needs.sync.result == 'success' || needs.sync.result == 'skipped') }}
    uses: get-h3/h3/.github/workflows/roundtrip.yml@main
